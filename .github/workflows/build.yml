name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-patch:
    runs-on: ubuntu-latest
    outputs:
      build_ref: ${{ steps.patch.outputs.build_ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 自动更新 C 版本号
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          FULL_VERSION=$(grep '^version = ' phira-mp-plus-server/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          MAJOR=$(echo "$FULL_VERSION" | cut -d. -f1)
          MINOR=$(echo "$FULL_VERSION" | cut -d. -f2)
          CURRENT_C=$(echo "$FULL_VERSION" | cut -d. -f3)
          PATCH=$((CURRENT_C + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "current=$CURRENT_C computed=$PATCH"
          if [[ "$CURRENT_C" != "$PATCH" && "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" == "push" ]]; then
            python scripts/sync-workspace-version.py "$NEW_VERSION"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add phira-mp-plus-server/Cargo.toml phira-plugin-sdk/Cargo.toml Cargo.lock
            git commit -m "chore: auto bump patch to $NEW_VERSION [skip ci]"
            git push
          fi
          echo "build_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    needs: auto-patch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-patch.outputs.build_ref }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Workspace version consistency
        run: python scripts/sync-workspace-version.py --check
      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Tests
        run: cargo test --locked --workspace --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Audit (advisory)
        run: cargo install cargo-audit --locked && cargo audit --deny warnings || echo "cargo audit 存在已知 advisory（rsa/no-fix, fxhash/paste/rustls-pemfile 不再维护, lru unsound）"

  build:
    needs: [auto-patch]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: phira-mp-plus-server-linux
            artifact-path: target/x86_64-unknown-linux-musl/release/phira-mp-plus-server
            setup: sudo apt-get update && sudo apt-get install -y musl-tools
            env:
              CC_x86_64_unknown_linux_musl: musl-gcc
              CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: phira-mp-plus-server-linux-glibc
            artifact-path: target/x86_64-unknown-linux-gnu/release/phira-mp-plus-server
            env: {}
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: phira-mp-plus-server-linux-arm64-glibc
            artifact-path: target/aarch64-unknown-linux-gnu/release/phira-mp-plus-server
            setup: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
            env:
              CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: phira-mp-plus-server-windows
            artifact-path: target/x86_64-pc-windows-msvc/release/phira-mp-plus-server.exe
            env: {}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-patch.outputs.build_ref }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}
          cache-on-failure: true
      - if: matrix.setup
        name: Setup System
        run: ${{ matrix.setup }}
      - name: cargo build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  pgo:
    needs: [auto-patch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-patch.outputs.build_ref }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: pgo-generate
          cache-on-failure: true
      - name: Install PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-client
          sudo pg_ctlcluster 16 main start 2>/dev/null || sudo pg_ctlcluster $(ls /etc/postgresql/) main start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -c "CREATE DATABASE phira_mp_plus;" 2>/dev/null || true

      - name: Build with profile-generate
        run: |
          mkdir -p /tmp/pgo-data
          cargo clean
          unset RUSTFLAGS
          export RUSTFLAGS="-Cprofile-generate=/tmp/pgo-data"
          CARGO_PROFILE_RELEASE_LTO=false \
          CARGO_PROFILE_RELEASE_STRIP=false \
            cargo build --locked --release --target x86_64-unknown-linux-gnu

          # 验证：binary 必须包含 LLVM profiling runtime 符号
          if ! nm target/x86_64-unknown-linux-gnu/release/phira-mp-plus-server | grep -q "llvm_profile"; then
            echo "ERROR: binary is NOT instrumented for PGO (no llvm_profile symbols)"
            exit 1
          fi
          echo "OK: binary is instrumented for PGO"

      - name: Run workload to collect profiles
        run: |
          export PM_DATABASE_URL="postgres://postgres:postgres@localhost:5432/phira_mp_plus"
          export LLVM_PROFILE_FILE="/tmp/pgo-data/default.profraw"

          # Start benchmark server, pipe benchmark CLI via stdin.
          # The benchmark runs in-process, connects to itself via TCP.
          # After the benchmark, stdin reaches EOF and CLI exits, but the
          # server keeps running until we send SIGINT.
          printf 'y\nbenchmark run --mode real --scenario gameplay --preset quick --duration 5s\n' | \
            ./target/x86_64-unknown-linux-gnu/release/phira-mp-plus-server \
              --port 22346 --http-port 22347 &
          SERVER_PID=$!

          # Give benchmark time to complete
          sleep 12

          # SIGINT triggers graceful shutdown. Curl the HTTP port to unblock
          # the accept loop so the server can exit.
          kill -INT $SERVER_PID 2>/dev/null || true
          curl -sf http://127.0.0.1:22347/ >/dev/null 2>&1 || true
          # Wait up to 20s for graceful shutdown + LLVM profile flush
          for i in $(seq 1 20); do
            kill -0 $SERVER_PID 2>/dev/null || break
            sleep 1
          done
          kill -9 $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

          ls -la /tmp/pgo-data/ 2>/dev/null || true

      - name: Merge profiles
        id: merge
        run: |
          LLVM_PROF="$(rustc --print sysroot)/bin/llvm-profdata"
          ls -la /tmp/pgo-data/
          if "$LLVM_PROF" merge -output=/tmp/pgo-data/merged.profdata /tmp/pgo-data/*.profraw 2>/dev/null; then
            echo "PGO profiles merged"
            echo "profiles_exist=true" >> "$GITHUB_OUTPUT"
          else
            echo "WARNING: No PGO profiles generated"
            echo "profiles_exist=false" >> "$GITHUB_OUTPUT"
          fi
          ls -la /tmp/pgo-data/

      - name: Build with profile-use
        if: steps.merge.outputs.profiles_exist == 'true'
        run: |
          cargo clean
          cargo build --release --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: "-Cprofile-use=/tmp/pgo-data/merged.profdata -Cllvm-args=-pgo-warn-missing-function=false"
          CARGO_PROFILE_RELEASE_DEBUG: 0

      - name: Upload PGO-optimized binary
        if: steps.merge.outputs.profiles_exist == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phira-mp-plus-server-linux-glibc-pgo
          path: target/x86_64-unknown-linux-gnu/release/phira-mp-plus-server
          if-no-files-found: warn

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-patch:
    runs-on: ubuntu-latest
    outputs:
      build_ref: ${{ steps.patch.outputs.build_ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 自动更新 C 版本号
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          FULL_VERSION=$(grep '^version = ' phira-mp-plus-server/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          MAJOR=$(echo "$FULL_VERSION" | cut -d. -f1)
          MINOR=$(echo "$FULL_VERSION" | cut -d. -f2)
          CURRENT_C=$(echo "$FULL_VERSION" | cut -d. -f3)
          PATCH=$((CURRENT_C + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "current=$CURRENT_C computed=$PATCH"
          if [[ "$CURRENT_C" != "$PATCH" && "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" == "push" ]]; then
            python scripts/sync-workspace-version.py "$NEW_VERSION"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add phira-mp-plus-server/Cargo.toml phira-plugin-sdk/Cargo.toml Cargo.lock
            git commit -m "chore: auto bump patch to $NEW_VERSION [skip ci]"
            git push
          fi
          echo "build_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    needs: auto-patch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-patch.outputs.build_ref }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Workspace version consistency
        run: python scripts/sync-workspace-version.py --check
      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Tests
        run: cargo test --locked --workspace --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Audit (advisory)
        run: cargo install cargo-audit --locked && cargo audit --deny warnings || echo "cargo audit 存在已知 advisory（rsa/no-fix, fxhash/paste/rustls-pemfile 不再维护, lru unsound）"

  build:
    needs: [auto-patch]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: phira-mp-plus-server-linux
            artifact-path: target/x86_64-unknown-linux-musl/release/phira-mp-plus-server
            setup: sudo apt-get update && sudo apt-get install -y musl-tools
            env:
              CC_x86_64_unknown_linux_musl: musl-gcc
              CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: phira-mp-plus-server-linux-glibc
            artifact-path: target/x86_64-unknown-linux-gnu/release/phira-mp-plus-server
            env: {}
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: phira-mp-plus-server-windows
            artifact-path: target/x86_64-pc-windows-msvc/release/phira-mp-plus-server.exe
            env: {}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-patch.outputs.build_ref }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}
          cache-on-failure: true
      - if: matrix.setup
        name: Setup System
        run: ${{ matrix.setup }}
      - name: cargo build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  pgo:
    needs: [auto-patch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-patch.outputs.build_ref }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: pgo-generate
          cache-on-failure: true
      - name: Install PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-client
          sudo pg_ctlcluster 16 main start 2>/dev/null || sudo pg_ctlcluster $(ls /etc/postgresql/) main start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -c "CREATE DATABASE phira_mp_plus;" 2>/dev/null || true
      - name: Build with profile-generate
        run: |
          mkdir -p /tmp/pgo-data
          # Disable LTO during generate — LTO + profile-generate can conflict
          CARGO_PROFILE_RELEASE_LTO=false \
          RUSTFLAGS="-Cprofile-generate=/tmp/pgo-data" \
            cargo build --release --target x86_64-unknown-linux-gnu
      - name: Run workload to collect profiles
        run: |
          export PM_DATABASE_URL="postgres://postgres:postgres@localhost:5432/phira_mp_plus"
          export LLVM_PROFILE_FILE="/tmp/pgo-data/%m_%p.profraw"
          # Start instrumented server in background
          target/x86_64-unknown-linux-gnu/release/phira-mp-plus-server --port 22346 --http-port 22347 --no-cli &
          SERVER_PID=$!
          sleep 4
          # Run benchmark to generate profile data
          echo "benchmark run --mode real --duration 10s" | timeout 20 target/x86_64-unknown-linux-gnu/release/phira-mp-plus-server --port 22348 --http-port 22349 --no-cli 2>/dev/null || true
          kill -TERM $SERVER_PID 2>/dev/null || true
          sleep 2
          ls -la /tmp/pgo-data/ 2>/dev/null || true
      - name: Merge profiles
        run: |
          llvm-profdata merge -output=/tmp/pgo-data/merged.profdata /tmp/pgo-data/*.profraw 2>/dev/null && echo "PGO profiles merged" || echo "WARNING: No PGO profiles generated"
      - name: Build with profile-use
        if: hashFiles('/tmp/pgo-data/merged.profdata') != ''
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: "-Cprofile-use=/tmp/pgo-data/merged.profdata -Cllvm-args=-pgo-warn-missing-function=false"
          CARGO_PROFILE_RELEASE_DEBUG: 0
      - name: Upload PGO-optimized binary
        if: hashFiles('/tmp/pgo-data/merged.profdata') != ''
        uses: actions/upload-artifact@v4
        with:
          name: phira-mp-plus-server-linux-glibc-pgo
          path: target/x86_64-unknown-linux-gnu/release/phira-mp-plus-server
          if-no-files-found: warn

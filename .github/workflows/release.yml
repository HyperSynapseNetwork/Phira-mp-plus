name: Release

on:
  workflow_dispatch:
    inputs:
      description:
        description: 版本说明（可选）
        type: string
        default: ""
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        shell: bash
        run: |
          set -euo pipefail
          FULL_VERSION=$(grep '^version = ' phira-mp-plus-server/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          python scripts/sync-workspace-version.py --check "$FULL_VERSION"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" != "v$FULL_VERSION" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match Cargo version v$FULL_VERSION" >&2
            exit 1
          fi
          echo "tag=v$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$FULL_VERSION" >> "$GITHUB_OUTPUT"

  quality-gate:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-quality
          cache-on-failure: true
      - name: Workspace version consistency
        run: python scripts/sync-workspace-version.py --check
      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Tests
        run: cargo test --locked --workspace --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  build:
    needs: [version, quality-gate]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact-name: phira-mp-plus-server-linux-musl-pgo
            artifact-path: target/x86_64-unknown-linux-musl/release/phira-mp-plus-server
            setup: sudo apt-get update && sudo apt-get install -y musl-tools
            env:
              CC_x86_64_unknown_linux_musl: musl-gcc
              CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact-name: phira-mp-plus-server-linux-glibc-pgo
            artifact-path: target/x86_64-unknown-linux-gnu/release/phira-mp-plus-server
            env: {}
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-name: phira-mp-plus-server-windows-pgo.exe
            artifact-path: target/x86_64-pc-windows-msvc/release/phira-mp-plus-server.exe
            env: {}
    runs-on: ${{ matrix.os }}
    env: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-pgo-${{ matrix.target }}
          cache-on-failure: true
      - if: matrix.setup
        name: Install system dependencies
        run: ${{ matrix.setup }}
      - if: matrix.os == 'ubuntu-latest'
        name: Install PostgreSQL (for PGO workload)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-client
          sudo pg_ctlcluster 16 main start 2>/dev/null || sudo pg_ctlcluster $(ls /etc/postgresql/) main start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -c "CREATE DATABASE phira_mp_plus;" 2>/dev/null || true
      - name: Build with profile-generate
        run: |
          PGO_DIR="/tmp/pgo-data/${{ matrix.target }}"
          mkdir -p "$PGO_DIR"
          unset RUSTFLAGS
          export RUSTFLAGS="-Cprofile-generate=$PGO_DIR"
          # Disable LTO and strip during generate — both can interfere
          CARGO_PROFILE_RELEASE_LTO=false \
          CARGO_PROFILE_RELEASE_STRIP=false \
            cargo build --locked --release --target ${{ matrix.target }}
      - if: matrix.os == 'ubuntu-latest'
        name: Run workload to collect profiles
        run: |
          PGO_DIR="/tmp/pgo-data/${{ matrix.target }}"
          mkdir -p "$PGO_DIR"
          export PM_DATABASE_URL="postgres://postgres:postgres@localhost:5432/phira_mp_plus"
          export LLVM_PROFILE_FILE="$PGO_DIR/%m_%p.profraw"

          # Start the instrumented server WITHOUT --no-cli so it reads from stdin.
          # The piped "benchmark run" command runs inside the server process and
          # connects to itself via TCP, generating profile data.
          echo "benchmark run --mode real --duration 10s" | \
            timeout 30 \
              target/${{ matrix.target }}/release/phira-mp-plus-server \
                --port 22346 --http-port 22347 \
                2>/dev/null || true

          ls -la "$PGO_DIR/"
          LLVM_PROF="$(rustc --print sysroot)/bin/llvm-profdata"
          if "$LLVM_PROF" merge -output="$PGO_DIR/merged.profdata" "$PGO_DIR"/*.profraw 2>/dev/null; then
            echo "PGO profiles merged for ${{ matrix.target }}"
          else
            echo "WARNING: No PGO profiles for ${{ matrix.target }}"
          fi
          ls -la "$PGO_DIR/"
      - name: Build with profile-use
        run: |
          PGO_DIR="/tmp/pgo-data/${{ matrix.target }}"
          PROFILES="$PGO_DIR/merged.profdata"
          if [ -f "$PROFILES" ]; then
            RUSTFLAGS="-Cprofile-use=$PROFILES -Cllvm-args=-pgo-warn-missing-function=false" \
              cargo build --locked --release --target ${{ matrix.target }}
          else
            echo "WARNING: No PGO profile at $PROFILES, building without PGO"
            cargo build --locked --release --target ${{ matrix.target }}
          fi
      - run: cp ${{ matrix.artifact-path }} ${{ matrix.artifact-name }}
      - name: Smoke test (linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x ${{ matrix.artifact-name }}
          ./${{ matrix.artifact-name }} --version || true
      - name: Generate provenance
        if: matrix.os == 'ubuntu-latest' && !matrix.pgo
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ matrix.artifact-name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}
          if-no-files-found: error

  package-sdk:
    needs: [version, quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打包 SDK + WIT
        run: |
          set -euo pipefail
          mkdir -p _sdk
          cp -r phira-plugin-sdk _sdk/phira-plugin-sdk
          cp -r wit _sdk/wit
          cd _sdk && tar czf ../phira-plugin-sdk.tar.gz phira-plugin-sdk wit
      - uses: actions/upload-artifact@v4
        with:
          name: phira-plugin-sdk
          path: phira-plugin-sdk.tar.gz
          if-no-files-found: error

  release:
    needs: [version, quality-gate, build, package-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: phira-*
          merge-multiple: true
      - name: Generate SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked || echo "cargo-cyclonedx install failed"
          cargo cyclonedx --output-format json 2>/dev/null || echo "SBOM generation skipped"
          ls -la *.cdx.json 2>/dev/null && echo "SBOM generated" || echo "No SBOM file"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.version.outputs.tag }}
          name: v${{ needs.version.outputs.version }}
          body: ${{ github.event.inputs.description }}
          files: |
            phira-mp-plus-server-linux-musl-pgo
            phira-mp-plus-server-linux-glibc-pgo
            phira-mp-plus-server-windows-pgo.exe
            phira-plugin-sdk.tar.gz
          prerelease: false
